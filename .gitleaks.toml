# Gitleaks: secret scanning (pre-commit hook + Security workflow).
# Default rules are kept; add exceptions only after gitleaks actually flags a false positive.

[extend]
useDefault = true

[allowlist]
description = "Test fixtures: hashes/addresses that look like secrets but aren't"
paths = [
  '''(^|/)mock_data/pouw-fixtures/(chain|events|meta)/''',
  '''(^|/)tests/fixtures/''',
]
